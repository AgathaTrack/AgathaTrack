name: Pipeline Claude run

# Pipeline v2 doorbell for claude-a (#2428 P3). Dispatched by the engine only; inputs hold
# public run metadata — never the prompt body or doorbell nonce (the nonce is not a step input).
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      stage:
        description: Canonical Stage name for this doorbell
        required: true
        type: string
      agent_id:
        description: Pool id (e.g. claude-a)
        required: true
        type: string
      method:
        description: Delivery method when no stage task applies
        required: true
        type: string
      nonce:
        description: Doorbell nonce. Secret until the run's verdict; never used in names or step env (PIPE-V2-D-REV3-011)
        required: true
        type: string
      run_ref:
        description: Public reference for the run name and status lookup (not the nonce)
        required: true
        type: string

run-name: pipeline-claude-${{ inputs.run_ref }}

permissions:
  contents: read
  issues: write

jobs:
  claude:
    name: pipeline-claude
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare PIPELINE_* env and prompt
        id: prep
        env:
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_AGENT_ID: ${{ inputs.agent_id }}
          INPUT_METHOD: ${{ inputs.method }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PAWPET_CLAUDE_TOKEN }}
        run: node scripts/pipeline_claude_prepare.js

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          PIPELINE_AGENT_ID: ${{ env.PIPELINE_AGENT_ID }}
          PIPELINE_RUN_NONCE: ${{ env.PIPELINE_RUN_NONCE }}
          PIPELINE_ISSUE: ${{ env.PIPELINE_ISSUE }}
          PIPELINE_STAGE: ${{ env.PIPELINE_STAGE }}
          # `gh` and scripts/pipeline_verdict.js read the token from the environment; without it
          # the run can read the issue but cannot react, comment or sign (soak-6, #2485).
          GH_TOKEN: ${{ secrets.PAWPET_CLAUDE_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PAWPET_CLAUDE_TOKEN }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: ${{ steps.prep.outputs.claude_args }}

      # A run that ends `success` with no vote, question or comment would otherwise read as
      # `finished` and hold the pickup behind `busy`. Failing here makes the runner status
      # `failed`, so the next live tick reassigns at once.
      - name: Verify the run left a result on the issue
        env:
          GH_TOKEN: ${{ secrets.PAWPET_CLAUDE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/pipeline_claude_verify.js
