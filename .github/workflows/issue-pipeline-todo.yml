name: Issue pipeline todo shortcut

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  todo:
    name: Backlog → To do shortcut
    if: github.event.label.name == 'todo'
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ensure todo label metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh label list --json name --jq '.[].name' | grep -Fxq 'todo'; then
            gh label create todo --color 'FBCA04' --description 'Shortcut: move issue To do and assign pawpet-claude (pipeline)'
          fi
          if ! gh label list --json name --jq '.[].name' | grep -Fxq 'pipeline-beta'; then
            gh label create pipeline-beta --color 'C5DEF5' --description 'Issue pipeline sandbox; required until ISSUE_PIPELINE=on'
          fi

      - name: Apply todo shortcut
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PIPELINE: ${{ vars.ISSUE_PIPELINE }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/issue_pipeline_todo.js ]; then
            echo "issue_pipeline_todo.js not on main yet"
            exit 0
          fi
          node scripts/issue_pipeline_todo.js