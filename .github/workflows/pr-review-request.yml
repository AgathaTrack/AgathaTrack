name: PR review request (agent PRs)

# Agent-authored PRs to main get no Copilot review from the ruleset (GitHub requests it as the bot author,
# which has no Copilot licence). Request Copilot with the owner's token; fall back to a Cursor review agent.
# Policy: docs/agent-efficiency/pr-review-cost-efficiency.md §Agent-authored PRs
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true

permissions:
  contents: read

jobs:
  # PR events cannot use the main-only automation environment, so a secret-less relay re-dispatches on main.
  # The relay never checks out PR code.
  relay:
    name: pr-review-request relay
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["pawpet-bot","pawpet-claude"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run pr-review-request.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"

  request:
    name: pr-review-request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 20
    concurrency:
      group: pr-review-request-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Request Copilot as owner, fall back to Cursor review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_COPILOT_REQUEST_TOKEN: ${{ secrets.OWNER_COPILOT_REQUEST_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_REVIEW_FALLBACK: ${{ vars.PR_REVIEW_FALLBACK || 'on' }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Bootstrap: the dispatch checks out main, which has no script until this workflow merges.
          if [ ! -f scripts/pr_review_request.js ]; then
            echo "scripts/pr_review_request.js is not on main yet; nothing to do"
            exit 0
          fi
          node scripts/pr_review_request.js --pr "$PR_NUMBER"
