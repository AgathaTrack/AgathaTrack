name: Cursor Bugbot fallback (Copilot absent)

# Queue Bugbot only when a PR actually merges to main — not on every open/sync.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cursor-bugbot-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  queue-bugbot:
    name: cursor-review-fallback
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Queue Cursor Bugbot when Copilot is absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.cursor_api_key }}
          CURSOR_REVIEW_FALLBACK: on
          CURSOR_FALLBACK_SKIP_SLEEP: 'true'
        run: node scripts/cursor_review_fallback.js run --pr "${{ github.event.pull_request.number }}"