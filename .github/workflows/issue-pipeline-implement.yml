name: Issue pipeline implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number queued in Ready (delivery label, unassigned)
        required: true
      launch:
        description: Call Cursor API when true (default stub in-progress marker only)
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  implement:
    name: Ready implement launch
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run implement launch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          ISSUE_PIPELINE: ${{ vars.ISSUE_PIPELINE }}
          PIPELINE_IMPLEMENT_LAUNCH: ${{ inputs.launch }}
          cursor_api_key: ${{ secrets.cursor_api_key }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { parseRepo } = require('./.github/scripts/github-project-lib');
          const { applyImplementLaunch } = require('./scripts/issue_pipeline_implement');
          const { resolvePipelineMode } = require('./scripts/issue_pipeline_dispatcher');
          const mode = resolvePipelineMode(process.env.ISSUE_PIPELINE);
          const dryRun = mode !== 'on';
          const { owner, repo } = parseRepo(process.env.GITHUB_REPOSITORY);
          const issueNumber = Number('${{ inputs.issue_number }}');
          const token = process.env.GITHUB_TOKEN;
          (async () => {
            const result = await applyImplementLaunch({
              owner,
              repo,
              issueNumber,
              token,
              projectsPat: process.env.GH_PROJECTS_PAT,
              projectId: process.env.GH_PROJECT_ID,
              statusFieldId: process.env.GH_STATUS_FIELD_ID,
              assignToken: process.env.EXECUTE_PLAN_BOT_TOKEN,
              dryRun,
            });
            console.log(JSON.stringify(result));
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE