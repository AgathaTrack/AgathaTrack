name: Issue pipeline delivery

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number in Ready (assigned pawpet-bot, converged)
        required: true
      delivery_method:
        description: PR, light-plan, or execute-plan (soak stub)
        required: false
        default: PR
      body_edit:
        description: Treat as body-edited this step (true/false)
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  delivery:
    name: Ready delivery (path gate + label)
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run delivery stub
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          ISSUE_PIPELINE: ${{ vars.ISSUE_PIPELINE }}
          PIPELINE_DELIVERY_METHOD: ${{ inputs.delivery_method }}
          PIPELINE_DELIVERY_BODY_EDIT: ${{ inputs.body_edit }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { parseRepo, fetchIssue } = require('./.github/scripts/github-project-lib');
          const { loadIssueState } = require('./scripts/issue_pipeline_state_load');
          const { applyDeliveryStub } = require('./scripts/issue_pipeline_delivery');
          const { bodySha } = require('./scripts/issue_pipeline_state');
          const { resolvePipelineMode } = require('./scripts/issue_pipeline_dispatcher');
          const mode = resolvePipelineMode(process.env.ISSUE_PIPELINE);
          const dryRun = mode !== 'on';
          const { owner, repo } = parseRepo(process.env.GITHUB_REPOSITORY);
          const issueNumber = Number('${{ inputs.issue_number }}');
          const token = process.env.GITHUB_TOKEN;
          (async () => {
            const issue = await fetchIssue(owner, repo, issueNumber, token);
            const { state } = await loadIssueState(owner, repo, issueNumber, token);
            const result = await applyDeliveryStub({
              owner,
              repo,
              issueNumber,
              token,
              projectsPat: process.env.GH_PROJECTS_PAT,
              projectId: process.env.GH_PROJECT_ID,
              statusFieldId: process.env.GH_STATUS_FIELD_ID,
              assignToken: process.env.EXECUTE_PLAN_BOT_TOKEN,
              state,
              liveBodySha: bodySha(issue.body || ''),
              dryRun,
            });
            console.log(JSON.stringify(result));
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE