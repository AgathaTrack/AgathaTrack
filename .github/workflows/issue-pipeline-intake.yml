name: Issue pipeline intake

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number for To-do intake lane
        required: true

permissions:
  contents: read
  issues: write

jobs:
  intake:
    name: To-do triage + intake handoff
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run To-do lane
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          ISSUE_PIPELINE: ${{ vars.ISSUE_PIPELINE }}
        run: |
          set -euo pipefail
          node -e "
          const { parseRepo } = require('./.github/scripts/github-project-lib');
          const { runTodoLanePipeline } = require('./scripts/issue_pipeline_intake');
          const { owner, repo } = parseRepo(process.env.GITHUB_REPOSITORY);
          const dryRun = String(process.env.ISSUE_PIPELINE || 'off').toLowerCase() === 'dry-run';
          runTodoLanePipeline({
            owner,
            repo,
            issueNumber: Number('${{ inputs.issue_number }}'),
            token: process.env.GITHUB_TOKEN,
            projectsPat: process.env.GH_PROJECTS_PAT,
            projectId: process.env.GH_PROJECT_ID,
            statusFieldId: process.env.GH_STATUS_FIELD_ID,
            assignToken: process.env.EXECUTE_PLAN_BOT_TOKEN,
            dryRun,
          }).then((r) => { console.log(JSON.stringify(r)); }).catch((e) => { console.error(e); process.exit(1); });
          "