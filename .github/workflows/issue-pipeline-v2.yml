name: Issue pipeline v2

# Pipeline v2 (#2385). Switches: docs/agent-efficiency/github-issue-workflow-operations.md §Pipeline switches (reference).
# ISSUE_PIPELINE_V2: off | dry-run | on (default off). dry-run logs; only `on` + ENGINE_PAT in engine.logins writes.
# Event wakes (#2560 P3); cron :11/:41 sweeper (PIPE-V2-HT-R-003).
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional positive issue number to decide for (empty = whole board). Anything else is refused before any read or write.
        required: false
        default: ''
      live:
        description: Write to the board. Off by default, so a manual run previews decisions only. Writes need the repo ISSUE_PIPELINE_V2 switch set to on.
        type: boolean
        required: false
        default: false
      mission:
        description: Scope this tick. `board` = full pipeline (default). `analyse` = Backlog intake through Ready only (requires issue_number; never ready.launch). Agent skills wake the engine with analyse + issue_number.
        type: choice
        required: false
        default: board
        options:
          - board
          - analyse
  issues:
    types: [edited, labeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy UAT (uat.agathatrack.com)
      - Deploy Production (agathatrack.com)
      - Pipeline Claude run
    types: [completed]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-pipeline-v2
  cancel-in-progress: false

jobs:
  wake-gate:
    name: Event wake gate
    if: vars.ISSUE_PIPELINE_V2 == 'dry-run' || vars.ISSUE_PIPELINE_V2 == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            scripts/issue_pipeline_v2_event_wake.js
            .github/pipeline-agents.json
          sparse-checkout-cone-mode: false

      - name: Decide whether this event should tick
        id: gate
        run: node scripts/issue_pipeline_v2_event_wake.js

  tick:
    name: issue-pipeline-v2
    needs: wake-gate
    if: >-
      needs.wake-gate.outputs.proceed == 'true' &&
      (vars.ISSUE_PIPELINE_V2 == 'dry-run' || vars.ISSUE_PIPELINE_V2 == 'on')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tick pipeline v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The v2 engine runs as its own account; the script reads this variable name.
          GH_PROJECTS_PAT: ${{ secrets.ENGINE_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          cursor_api_key: ${{ secrets.cursor_api_key }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          ISSUE_PIPELINE_V2: ${{ vars.ISSUE_PIPELINE_V2 }}
          # Soak scope: when set (e.g. pipeline-beta), `on` writes only to issues with this label.
          ISSUE_PIPELINE_V2_LABEL: ${{ vars.ISSUE_PIPELINE_V2_LABEL }}
          # `off` lifts the Ready queue cap (limits.wip) for the run. Any other value keeps it.
          WIP_LIMIT: ${{ vars.WIP_LIMIT }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          # Manual dispatch previews unless `live` is ticked (scripts/issue_pipeline_v2_dispatch.js).
          ISSUE_PIPELINE_V2_LIVE: ${{ inputs.live && 'true' || 'false' }}
          PIPELINE_V2_MISSION: ${{ inputs.mission || 'board' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/issue_pipeline_v2.js