name: Issue pipeline v2

# Run A of #2385: dry-run only. ISSUE_PIPELINE_V2 is its own switch (off | dry-run | on) and is
# deliberately separate from ISSUE_PIPELINE, which controls the old engine. Default is off.
# The runner never writes in this run; event triggers arrive with the review lane (P3).
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to log a decision for (the whole board is still read)
        required: false

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-pipeline-v2
  cancel-in-progress: false

jobs:
  tick:
    name: issue-pipeline-v2
    if: vars.ISSUE_PIPELINE_V2 == 'dry-run' || vars.ISSUE_PIPELINE_V2 == 'on'
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tick pipeline v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The v2 engine runs as its own account; the script reads this variable name.
          GH_PROJECTS_PAT: ${{ secrets.ENGINE_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          cursor_api_key: ${{ secrets.cursor_api_key }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          ISSUE_PIPELINE_V2: ${{ vars.ISSUE_PIPELINE_V2 }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        run: node scripts/issue_pipeline_v2.js
