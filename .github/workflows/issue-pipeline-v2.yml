name: Issue pipeline v2

# Pipeline v2 (#2385). ISSUE_PIPELINE_V2 is its own switch (off | dry-run | on) and is deliberately
# separate from ISSUE_PIPELINE, which controls the old engine. Default is off. dry-run logs the
# decisions and the requests they would make; only `on`, with ENGINE_PAT belonging to a login in
# .github/pipeline-agents.json `engine.logins`, writes.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to log a decision for (the whole board is still read)
        required: false

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-pipeline-v2
  cancel-in-progress: false

jobs:
  tick:
    name: issue-pipeline-v2
    if: vars.ISSUE_PIPELINE_V2 == 'dry-run' || vars.ISSUE_PIPELINE_V2 == 'on'
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tick pipeline v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The v2 engine runs as its own account; the script reads this variable name.
          GH_PROJECTS_PAT: ${{ secrets.ENGINE_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          cursor_api_key: ${{ secrets.cursor_api_key }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          # Master HMAC key for signed spec/review verdicts (never passed to runners).
          ISSUE_PIPELINE_V2: ${{ vars.ISSUE_PIPELINE_V2 }}
          # Soak scope: when set (e.g. pipeline-beta), `on` writes only to issues with this label.
          ISSUE_PIPELINE_V2_LABEL: ${{ vars.ISSUE_PIPELINE_V2_LABEL }}
          # `off` lifts the Ready queue cap (limits.wip) for the run. Any other value keeps it.
          WIP_LIMIT: ${{ vars.WIP_LIMIT }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        run: node scripts/issue_pipeline_v2.js
